name: tests

on:
  workflow_call:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: "--optimize-autoloader"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Node Dependencies
        run: bun install --frozen-lockfile

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Generate Passport Keys
        run: php artisan passport:keys --no-interaction

      - name: Build Assets
        run: bun run build

      - name: Frontend Tests
        run: bun run test

      - name: Tests
        run: php artisan test --parallel

  postgres-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: shoutrrr_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shoutrrr_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shoutrrr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: gd, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: "--optimize-autoloader"

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Generate Passport Keys
        run: php artisan passport:keys --no-interaction

      - name: Verify PostgreSQL Migrations
        run: php artisan migrate:fresh --force --no-interaction

      # Tests disable Vite in the shared TestCase, so this backend gate does not
      # need Bun or a duplicated frontend build.
      - name: PostgreSQL Backend Tests
        run: php artisan test --parallel

  static-analysis:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: "--optimize-autoloader"

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Type Analysis
        run: composer types:check

  container-build:
    name: Production container build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: shoutrrr:ci
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=production-image
          cache-to: type=gha,scope=production-image,mode=max
          provenance: false

      - name: Smoke test production image
        run: |
          docker run -d \
            --name shoutrrr-ci \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e QUEUE_WORKER_ENABLED=false \
            -e SCHEDULER_ENABLED=false \
            -p 127.0.0.1:18080:8080 \
            shoutrrr:ci

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/up >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs shoutrrr-ci
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force shoutrrr-ci 2>/dev/null || true
