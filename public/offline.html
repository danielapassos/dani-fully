<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#101010">
        <title>Shoutrrr is offline</title>
        <style>
            :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
            * { box-sizing: border-box; }
            body { align-items: center; background: #101010; color: #fafafa; display: flex; margin: 0; min-height: 100vh; padding: 24px; }
            main { margin: auto; max-width: 420px; text-align: center; }
            svg { height: 56px; margin-bottom: 20px; width: 56px; }
            h1 { font-size: 24px; letter-spacing: -0.02em; margin: 0 0 8px; }
            p { color: #b8b8b8; line-height: 1.55; margin: 0 0 24px; }
            a { background: #fafafa; border-radius: 8px; color: #101010; display: inline-block; font-weight: 700; padding: 10px 16px; text-decoration: none; }
            a:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
        </style>
    </head>
    <body>
        <main>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 11.5 20 4l-4.5 16-4.2-5.8L3 11.5Z" />
                <path d="m11.3 14.2 3.6-4.1" />
            </svg>
            <h1>Shoutrrr is offline</h1>
            <p>Your account data stays private and uncached. Reconnect, then retry to keep scheduling.</p>
            <a href="/">Try again</a>
        </main>
    </body>
</html>
